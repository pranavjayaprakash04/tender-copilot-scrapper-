name: TenderPilot Autonomous Scraper

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      portal:
        description: 'Which portal to scrape'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - gem
          - cppp
          - tn
          - nic-mp
          - nic-odisha
          - nic-chandigarh
          - nic-delhi
          - nic-coal
          - nic-iocl
          - nic-ntpc
          - nic-cpcl
          - nic-bhel

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Limit concurrent writes so Supabase does not cancel upserts under load.
      max-parallel: 3
      matrix:
        portal: [gem, cppp, tn, nic-mp, nic-odisha, nic-chandigarh, nic-delhi, nic-coal, nic-iocl, nic-ntpc, nic-cpcl, nic-bhel]
    name: Scrape ${{ matrix.portal }}
    steps:
      - name: Check if portal should run
        id: check
        env:
          SELECTED_PORTAL: ${{ github.event.inputs.portal || 'all' }}
          PORTAL: ${{ matrix.portal }}
        run: |
          if [ "$SELECTED_PORTAL" = "all" ] || [ "$SELECTED_PORTAL" = "$PORTAL" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        if: steps.check.outputs.run == 'true'
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.check.outputs.run == 'true'
        run: npx playwright install chromium --with-deps

      - name: Create logs directory
        if: steps.check.outputs.run == 'true'
        run: mkdir -p logs

      - name: Run ${{ matrix.portal }} scraper
        if: steps.check.outputs.run == 'true'
        env:
          PORTAL: ${{ matrix.portal }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          REQUEST_DELAY_MIN: 2000
          REQUEST_DELAY_MAX: 5000
        run: |
          case "$PORTAL" in
            gem|cppp|tn) node "$PORTAL.js" ;;
            nic-*) node gepnic.js "$PORTAL" ;;
            *) echo "Unknown portal: $PORTAL" >&2; exit 2 ;;
          esac

      - name: Upload scraper logs
        if: always() && steps.check.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.portal }}-${{ github.run_number }}
          path: logs/
          retention-days: 7
